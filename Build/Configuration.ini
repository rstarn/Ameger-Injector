; Plaintext master config (editable source of truth). What: default target,
; payload pin, and pipeline toggles consumed by the launcher after DPAPI
; encryption (see Build/Executors/Create.bat :protect_config). Why plaintext
; here: this file never ships; the deployed copy next to the EXE is encrypted
; (SYSCFG01 blob) and re-pinned to the deployed payload digest. SchemaVersion
; must be 1 or the launcher refuses the config.
[General]
; Shell wait budget in ms (1000..INT_MAX). Detection follows immediately after
; the operator confirms, so this bounds the remote-shell run only.
Timeout = 30000
SchemaVersion = 1
; Target process image name (matched case-insensitively, .exe appended when
; bare). Empty is a config error, never a default.
ProcessName = "Overwatch.exe"
; SHA-256 pin of the pristine payload asset (Assets\DLL\Jlov.dll). Mandatory:
; empty/malformed pins fail closed in the launcher. Adaptivity: the build
; updates this pin to whatever file is currently at that path, so swapping the
; payload DLL back and forth just works (set AMEGER_STRICT_PAYLOAD=1 to refuse a
; mismatch instead of auto-adopting). "Create.bat repin" refreshes it on demand.
; To SHIP a changed payload WITHOUT moving this pin, drop it at
; Assets\DLL\Jlov.protected.dll or set AMEGER_PAYLOAD=<path>: the build then
; re-pins the deployed copy instead. The shipped config always pins the exact
; deployed bytes, so the launcher load-time hash check is unchanged either way.
PayloadSha256 = 551F794BA6C38BB1FA01A35CDA6C4E282D396F23C892A902D127E2A0D13279DB

; Launcher behavior toggles (Y/N). Quiet mutes trace output; HijackScan enables
; the donor scan (off = sponsor-only, fails closed without a sponsor);
; HookRestore restores system-DLL hooks pre/post load (game .text is
; survey-only, never written); VerboseTrace prints the full acquisition trace;
; HandleHijacking selects stealth acquisition (off = direct open, loudest
; telemetry); SponsorRoundtrip runs the sponsor memory proof; DetachConsole
; drops the console window after the target is selected (all startup checks +
; confirmation need it, nothing after does), so no window exists while target
; handles are held. Default N (operator watches progress); Y runs the sensitive
; phase headless (verdict unprinted, exit code only).
; No on-disk cloak toggles exist any more: the payload is only ever read as
; caller-owned bytes and mapped from memory, so there is no temp copy to make
; and no on-disk name to scramble.
Quiet = N
DetachConsole = N
HijackScan = Y
HookRestore = N
VerboseTrace = Y
HandleHijacking = Y
SponsorRoundtrip = N

; In-target shell pipeline stages (Y/N), executed in ManualMapping_Shell
; order. ExecuteTLS runs TLS callbacks; RunDLLMain runs DllMain(ATTACH);
; LoadFromMemory is mandatory (memory descriptor path with hash pin);
; LockLoaderLock serializes under the loader lock; ResolveImports/
; ResolveDelayImports bind via LDR; EnableExceptions installs reversible SEH via the dynamic function table (RtlAddFunctionTable; zero VEH, no inverted-table insert, runtime-verified via RtlLookupFunctionEntry) so a failed injection FREES the image instead of leaking it - the inverted-table fallback (with its isolated leak) runs only if this build does not honor the dynamic path; SetPageProtections applies the final RX/RW/RO
; split (W^X, never RWX); InitSecurityCookie seeds ___security_cookie;
; CleanDataDirectories zeroes import/export/debug/reloc/TLS metadata.
[ManualMap]
ExecuteTLS = Y
RunDLLMain = Y
LoadFromMemory = Y
LockLoaderLock = Y
ResolveImports = Y
; Keep OFF on Warden/Eidolon-protected targets: registering the payload SEH as
; a process-wide dynamic function table makes the OS unwind/exception dispatch
; reference a non-module image, which Warden audit-veh/INT3 dispatch tables for
; and crashes the target post-inject (observed EXCEPTION_ACCESS_VIOLATION on the
; hijacked thread). The mechanism is now fully reversible (no leak-on-uncertainty
; tradeoff remains), but enable Y only for targets that do not enforce the
; exception-dispatch structures.
EnableExceptions = N
SetPageProtections = Y
InitSecurityCookie = Y
ResolveDelayImports = Y
CleanDataDirectories = Y
