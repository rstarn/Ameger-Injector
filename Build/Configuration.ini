[General]
; TestMode forces the target to notepad.exe, allows the handle donor scan to
; fall back to a direct handle, starts a scratch notepad when the operator has
; none open, closes that scratch target when the run ends, and always writes
; the run transcript. It is a smoke test of the load path, not a real load.
; Set this to N to point the tool at ProcessName below.
TestMode = N
Timeout = 30000
SchemaVersion = 1
ProcessName = "Overwatch.exe"
PayloadSha256 = 551F794BA6C38BB1FA01A35CDA6C4E282D396F23C892A902D127E2A0D13279DB

Quiet = N
HijackScan = Y
VerboseTrace = Y
DetachConsole = N
HandleHijacking = Y
SponsorRoundtrip = N

; The transcript of the run. It is always written, whether the run
; succeeded or failed, because the record of a successful load is the one
; worth having. Set this to Y to remove it after a successful load; a failed
; or cancelled run always keeps its transcript.
DiscardResultLogOnSuccess = N

; Whether the "begin load?" confirmation is answered for the operator. It
; lives here rather than in an environment variable because the launcher
; runs elevated, and an elevated process does not inherit its parent's
; environment, so an environment variable set on the command line would
; never be seen. A test run always answers it for itself.
AutoConfirm = N

; The image a test run points at. It has to be an image that stays running as
; one process; some modern applications start a broker that hands off to the
; real instance and then exits, which the launcher cannot map into.
TestTarget = notepad.exe

; Bounds on the region census of the target. Zero means no limit. These live
; here rather than in environment variables because the launcher runs
; elevated, and an elevated process does not inherit its parent's
; environment.
SurveyMaxMb = 0
SurveyMaxRegions = 0
SurveyMaxSampleRegions = 0

; The owners a donor process handle is never taken from. An empty value uses
; the built-in list of the credential and session stores.
DonorOwnerBlocklist =

[ManualMap]
ExecuteTLS = Y
RunDLLMain = Y
LockLoaderLock = Y
ResolveImports = Y
EnableExceptions = N
SetPageProtections = Y
InitSecurityCookie = Y
ResolveDelayImports = Y
CleanDataDirectories = Y